map $http_origin $inkos_bad_origin {
    default 1;
    "" 0;
    "https://write.liewchentong.com" 0;
}
server {
    listen 443 ssl proxy_protocol default_server;
    ssl_reject_handshake on;
}
server {
    listen 443 ssl proxy_protocol;
    server_name write.liewchentong.com;
    ssl_certificate /etc/nginx/inkos-tls/cert.pem;
    ssl_certificate_key /etc/nginx/inkos-tls/key.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    set_real_ip_from 172.30.40.254;
    real_ip_header proxy_protocol;
    client_max_body_size 64m;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy same-origin always;
    resolver 127.0.0.11 valid=10s ipv6=off;
    location = /_access {
        internal;
        set $auth_backend access-check:4568;
        proxy_pass http://$auth_backend/verify;
        proxy_pass_request_body off;
        proxy_set_header Content-Length "";
        proxy_set_header Cf-Access-Jwt-Assertion $http_cf_access_jwt_assertion;
    }
    location / {
        if ($inkos_bad_origin) { return 403; }
        auth_request /_access;
        set $app_backend app:4567;
        proxy_pass http://$app_backend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header Connection "";
        proxy_hide_header Access-Control-Allow-Origin;
        proxy_buffering off;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }
}
server {
    listen 127.0.0.1:8081;
    location = /healthz { access_log off; return 200 "ok\n"; }
    location / { return 404; }
}
