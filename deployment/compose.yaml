name: inkos
services:
  app:
    image: ${INKOS_IMAGE:?Set pinned INKOS_IMAGE}
    restart: unless-stopped
    init: true
    read_only: true
    cpus: 1.0
    mem_limit: 1g
    pids_limit: 256
    security_opt: [no-new-privileges:true]
    cap_drop: [ALL]
    volumes:
      - /srv/inkos/data:/data
    tmpfs: ['/tmp:size=128m,mode=1777']
    networks: [backend]
    healthcheck:
      test: [CMD, node, -e, "fetch('http://127.0.0.1:4567/api/v1/books').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 45s
    logging: {driver: json-file, options: {max-size: 10m, max-file: '3'}}
  access-check:
    image: ${INKOS_IMAGE:?Set pinned INKOS_IMAGE}
    entrypoint: [node, /opt/inkos-deployment/access-check.mjs]
    env_file: [/etc/inkos/access.env]
    restart: unless-stopped
    init: true
    read_only: true
    mem_limit: 128m
    pids_limit: 64
    security_opt: [no-new-privileges:true]
    cap_drop: [ALL]
    networks: [backend]
    healthcheck:
      test: [CMD, node, -e, "fetch('http://127.0.0.1:4568/healthz').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3
    logging: {driver: json-file, options: {max-size: 10m, max-file: '3'}}
  origin:
    image: nginx@sha256:73c75df4075c918f91017fdda46ad81e55e5af77ba3a64ca3d5014bd9244fe7f
    entrypoint: [nginx, -g, 'daemon off;']
    restart: unless-stopped
    read_only: true
    mem_limit: 128m
    pids_limit: 64
    security_opt: [no-new-privileges:true]
    volumes:
      - /etc/inkos/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - /etc/inkos/tls:/etc/nginx/inkos-tls:ro
    tmpfs: [/var/cache/nginx, /var/run]
    networks:
      backend:
      ingress:
        aliases: [inkos-origin]
    depends_on:
      app: {condition: service_healthy}
      access-check: {condition: service_healthy}
    healthcheck:
      test: [CMD, wget, -q, -O, /dev/null, 'http://127.0.0.1:8081/healthz']
      interval: 30s
      timeout: 5s
      retries: 3
    logging: {driver: json-file, options: {max-size: 10m, max-file: '3'}}
networks:
  backend:
    name: inkos-backend
  ingress:
    name: inkos-ingress
    external: true
